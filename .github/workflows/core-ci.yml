name: Core CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "release/**"
      - "inf/**"

# Every job here works off the repository's contents: checkout, setup-node,
# docker build, npm ci, mocha, docker compose config, actions/upload-artifact
# (which rides the Actions runtime token, not the repository token). None of
# them needs more than read access, so the token is scoped to the least that
# satisfies every job in this file rather than inherited from the repository
# default. The one observable price is named in line at the secret scanner.
permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    # Pull requests only. A push carries no base and head revision to take a
    # range between, and the repository's own history predates the requirement:
    # almost none of its commits carry the trailer and none of them can be
    # signed retroactively. The terms this gate enforces are in CONTRIBUTING.md.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout with PR history
        uses: actions/checkout@v7
        with:
          # Without the full history the range between the base and the head
          # revision does not resolve.
          fetch-depth: 0

      - name: Every commit in this PR carries Signed-off-by
        shell: bash
        # The two revisions arrive through the environment rather than by
        # interpolation into the body of the step. A value from the event
        # context pasted straight into the text of a script is the classic way
        # to get somebody else's code executed in CI.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # --no-merges: a merge commit is created by GitHub, not by a
          # contributor, and carries no authorship to certify.
          #
          # The trailer is read with git's own %(trailers:...) format rather
          # than with a regexp over the message body. A regexp breaks on folded
          # trailers, on continuation lines, and on a Signed-off-by quoted
          # inside prose.
          #
          # What is checked is that the trailer is there, not that the sign-off
          # address matches the author address. dependabot signs as
          # support@github.com while authoring under its noreply address, so a
          # checker comparing the two would go red on every one of its pull
          # requests. The off-the-shelf answers to that are an explicit bot
          # exemption or a bot exclusion by default, and this project wanted
          # neither: checking presence lets the bot through honestly, without a
          # single exception in configuration.
          #
          # The list of revisions is materialized into a variable before the
          # loop reads it. Feeding a command's output straight into the loop
          # makes the command's exit status invisible to this shell: a failure
          # to even enumerate the range would look like an empty input, zero
          # iterations, and a clean bill of health. Assigning first means the
          # failure of the enumeration reaches `set -euo pipefail` and stops
          # the step before it can claim nothing was missing.

          # The full size of the range is counted before the merge filter is
          # applied, so a range that exists but has nothing to certify is told
          # apart from a range that was never there.
          total="$(git rev-list --count "${PR_BASE_SHA}..${PR_HEAD_SHA}")"

          if [ "${total}" -eq 0 ]; then
            echo "Range ${PR_BASE_SHA}..${PR_HEAD_SHA} contains no commits to check." >&2
            echo "A pull request with zero commits means the base and head revisions were not resolved against a real history." >&2
            exit 1
          fi

          # Non-merge revisions only. If the range holds nothing but merge
          # commits, the step passes - but it says so out loud rather than
          # letting an empty list read as "checked and clean".
          revisions="$(git rev-list --no-merges "${PR_BASE_SHA}..${PR_HEAD_SHA}")"

          if [ -z "${revisions}" ]; then
            echo "All ${total} commit(s) in range ${PR_BASE_SHA}..${PR_HEAD_SHA} are merge commits; none carry authorship to certify."
            exit 0
          fi

          missing=0

          while read -r sha; do
            if [ -z "${sha}" ]; then
              continue
            fi

            if [ -n "$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}")" ]; then
              continue
            fi

            # Only the revision id goes into the annotation. A commit subject is
            # pull request content, and Actions reads a line beginning with two
            # colons as a workflow command, so the subject is printed on a line
            # of its own behind a fixed prefix of ours and can never be the
            # first characters of a line.
            echo "::error::commit ${sha} carries no Signed-off-by trailer"
            echo "  subject of ${sha}: $(git log -1 --format='%s' "${sha}")"
            missing=$((missing + 1))
          done <<< "${revisions}"

          if [ "${missing}" -ne 0 ]; then
            echo "${missing} commit(s) in this pull request need a sign-off." >&2
            echo "Sign the ones you wrote, where they are:" >&2
            echo "  git rebase --signoff ${PR_BASE_SHA}" >&2
            echo "See CONTRIBUTING.md for what the sign-off certifies." >&2
            exit 1
          fi

          echo "Every commit in this pull request carries a Signed-off-by trailer."

  test:
    name: Core contract tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run contract tests
        run: |
          ./node_modules/.bin/mocha \
            t/unit/diagnostics.js \
            t/unit/edition_initialization.js \
            t/unit/edition_premium_loader.js \
            t/unit/edition_community.js \
            t/unit/edition_community_boundary.js \
            t/unit/edition_registry.js \
            t/unit/features.js \
            t/unit/email_template_paths.js \
            t/unit/partial_template_paths.js \
            t/unit/view_engine_paths.js

      - name: Run focused Phase 0 tests (password / migrator / auth_security)
        run: |
          ./node_modules/.bin/mocha \
            t/unit/auth/password.js \
            t/unit/db_migrator.js \
            t/unit/middleware/auth_security.js \
            --timeout 10000

      - name: Run all unit tests and enforce coverage baseline
        run: |
          node bin/db_update.js
          npm run test:coverage
        env:
          NODE_ENV: test
          DB_DIALECT: sqlite
          DB_STORAGE: /tmp/unit-test.sqlite
          TIMEOFF_FEATURES: all

      - name: Validate community compose
        run: docker compose config --quiet
        env:
          SESSION_SECRET: ci-session-secret
          CRYPTO_SECRET: ci-crypto-secret

      - name: Validate commercial compose
        run: |
          mkdir -p ../timeoff-premium
          docker compose -f docker-compose.yml -f docker-compose.commercial.yml config --quiet
        env:
          SESSION_SECRET: ci-session-secret
          CRYPTO_SECRET: ci-crypto-secret
          TIMEOFF_PREMIUM_MODULE_HOST_PATH: ../timeoff-premium
          TIMEOFF_LICENSE: ci-license-placeholder
          TIMEOFF_LICENSE_PUBLIC_KEY: ci-public-key-placeholder

      - name: Validate premium dev compose
        run: |
          mkdir -p ../timeoff-premium
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.premium-dev.yml config --quiet
        env:
          SESSION_SECRET: ci-session-secret
          CRYPTO_SECRET: ci-crypto-secret
          TIMEOFF_PREMIUM_MODULE_HOST_PATH: ../timeoff-premium

      - name: Validate portal compose
        run: |
          mkdir -p /tmp/portal-secrets
          openssl genpkey -algorithm RSA -out /tmp/portal-secrets/license_private.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          openssl rsa -in /tmp/portal-secrets/license_private.pem -pubout -out /tmp/portal-secrets/license_public_key.pem 2>/dev/null
          docker compose -f docker-compose.portal.yml config --quiet
        env:
          PORTAL_SESSION_SECRET: ci-portal-session-secret
          PORTAL_PRIVATE_KEY_FILE: /tmp/portal-secrets/license_private.pem
          PORTAL_PUBLIC_KEY_FILE: /tmp/portal-secrets/license_public_key.pem

  docker-build:
    name: Docker image build (runtime target)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build community runtime image
        run: docker build --target runtime -t leavepilot-ce:ci .

      - name: Verify licence files inside the runtime image
        run: scripts/verify-artifact-licenses.sh leavepilot-ce:ci

  portal-docker-build:
    name: Portal Docker image build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build portal image
        run: docker build -f Dockerfile.portal -t leavepilot-portal:ci .

      - name: Verify licence files inside the portal image
        run: scripts/verify-artifact-licenses.sh leavepilot-portal:ci

  mysql-migration-smoke:
    name: Fresh MySQL 8 migration smoke test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Start disposable MySQL 8
        run: |
          docker run -d --name lp-mysql \
            -e MYSQL_ROOT_PASSWORD=rootpw \
            -e MYSQL_DATABASE=lp_test \
            -p 3306:3306 \
            mysql:8.0
          echo "Waiting for MySQL to become healthy..."
          for i in $(seq 1 60); do
            if docker exec lp-mysql mysqladmin ping -h127.0.0.1 -uroot -prootpw >/dev/null 2>&1; then
              echo "MySQL ready (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"; docker logs lp-mysql; exit 1

      - name: Install dependencies
        run: npm ci
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Migrate fresh DB (run #1) and dump schema
        run: |
          # Actions runs each step with `bash -e`, which has no pipefail: the
          # status of `a | tee b` is tee's, and tee always succeeds. The grep
          # below covers a migration that throws, since db_update prints its
          # marker only after they have all run - but not what it does
          # afterwards, and not a reordering of that logging.
          set -o pipefail
          node bin/db_update.js | tee run1.log
          grep -q "Fresh database" run1.log
          node bin/dump_schema.js > schema-fresh-mysql.sql
          echo "---- fresh schema (first 40 lines) ----"
          head -40 schema-fresh-mysql.sql
        env:
          NODE_ENV: test
          DB_DIALECT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: lp_test
          DB_USER: root
          DB_PASSWORD: rootpw

      - name: Migrate again (run #2) and assert no-op + identical schema
        run: |
          set -o pipefail
          node bin/db_update.js | tee run2.log
          grep -q "Applied migrations: none" run2.log
          if grep -q "Fresh database" run2.log; then
            echo "ERROR: second run re-bootstrapped the database"; exit 1
          fi
          node bin/dump_schema.js > schema-after-rerun.sql
          if ! diff -u schema-fresh-mysql.sql schema-after-rerun.sql; then
            echo "ERROR: schema changed between migration runs (not idempotent)"; exit 1
          fi
          echo "Idempotent: second run is a no-op and schema is unchanged."
        env:
          NODE_ENV: test
          DB_DIALECT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: lp_test
          DB_USER: root
          DB_PASSWORD: rootpw

      - name: Upload fresh MySQL schema artifact (for offline prod comparison)
        uses: actions/upload-artifact@v7
        with:
          name: schema-fresh-mysql
          path: schema-fresh-mysql.sql
          if-no-files-found: error

      - name: Stop disposable MySQL
        if: always()
        run: docker rm -f lp-mysql || true

  security:
    name: Security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # Price of the top-level `permissions: contents: read`: gitleaks still
        # detects secrets and fails the job on a find, but it can no longer
        # post the inline PR comment it does with `pull-requests: write`.
        # Detection and the non-zero exit do not depend on the token's scope,
        # only the comment does - and a missing comment is the lesser surprise
        # than a job that silently inherits write access it never needs.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
