name: Core integration

# The browser suite covers what unit tests cannot: real layout geometry, sticky
# headers, WCAG contrast of rendered pixels, keyboard and pointer behaviour.
# Until now it ran on nobody's machine automatically, so a stylesheet change
# could break it silently — Core CI only runs the unit tests.

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "release/**"
      - "inf/**"

# Both external actions used here - actions/checkout and actions/setup-node -
# need only read access to the repository's contents, and the browser suite
# writes nothing back. The token is scoped to the least sufficient permission
# rather than inherited from the repository default.
permissions:
  contents: read

jobs:
  integration:
    name: Browser suite ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # Each shard is a quarter of the suite, so the cap is generous for one.
    timeout-minutes: 30

    strategy:
      # A red shard should not hide the state of the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore pinned browser test infrastructure
        uses: actions/cache@v4
        with:
          path: .artifacts/verify/browser
          key: browser-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Bootstrap and record pinned browser versions
        run: |
          node bin/browser_setup.js --bootstrap
          node bin/browser_setup.js --print-env

      - name: Verify the committed stylesheet is current
        # Several suites assert against compiled CSS. Recompiling silently would
        # hide a stale checked-in build, so compare instead of overwrite.
        run: node bin/verify.js --stage css-build-diff

      - name: Run registry-selected integration shard
        # The matrix chooses only which frozen registry entry to run. Batch
        # shape, retries, and deadlines stay in lib/verify/stages.js.
        run: node bin/verify.js --stage browser-${{ matrix.shard }}
        env:
          NODE_ENV: test
          TEST_DB_STORAGE: /tmp/integration-test-${{ matrix.shard }}.sqlite

      - name: Write flake report to the job summary
        # D-06: the summary exists on every build, red included - the runner
        # writes flake-report.json on its failure path too. Zero records are
        # stated explicitly, so an empty report reads as "nothing retried",
        # not as "nothing checked".
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("flake-report.json", "utf8"));
            const lines = ["## Flake report (shard ${{ matrix.shard }})", ""];
            if (report.length === 0) {
              lines.push("Zero retry records: no integration batch and no single test needed a second attempt.");
            } else {
              lines.push(report.length + " retry record(s):", "");
              report.forEach(record => {
                lines.push("- **" + record.contour + "** (attempt " + record.attempt + "): " + record.spec);
                (record.tests || []).forEach(name => lines.push("  - " + name));
              });
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload flake report
        # Every shard build publishes the artifact, empty included: a missing
        # file is a defect of the runner contract, not an empty flake
        # (hence if-no-files-found: error rather than ignore).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-shard-${{ matrix.shard }}
          path: flake-report.json
          if-no-files-found: error

      - name: Upload browser batch diagnostics
        # The runner writes one bounded/redacted JSON report per batch. Keep
        # this independent of the job log: failures in Actions log export must
        # not erase the only useful browser failure context.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-batch-diagnostics-shard-${{ matrix.shard }}
          path: .artifacts/verify/browser-batch-diagnostics/
          if-no-files-found: error

      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-browser-shard-${{ matrix.shard }}
          path: .artifacts/verify/
          if-no-files-found: error
