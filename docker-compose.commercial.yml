services:
  app:
    build:
      context: .
      target: commercial
      additional_contexts:
        timeoff_premium: ${TIMEOFF_PREMIUM_MODULE_HOST_PATH:-../timeoff-premium}
    environment:
      TIMEOFF_PREMIUM_MODULE: /opt/timeoff-premium
      TIMEOFF_PREMIUM_MODULE_REQUIRED: "true"
      TIMEOFF_LICENSE: ${TIMEOFF_LICENSE:?TIMEOFF_LICENSE is required}
      TIMEOFF_LICENSE_PUBLIC_KEY: ${TIMEOFF_LICENSE_PUBLIC_KEY:?TIMEOFF_LICENSE_PUBLIC_KEY is required}
      TIMEOFF_LICENSE_PUBLIC_KEYS: ${TIMEOFF_LICENSE_PUBLIC_KEYS:-}
      TIMEOFF_LICENSE_REVOCATION_LIST: ${TIMEOFF_LICENSE_REVOCATION_LIST:-}
      TIMEOFF_LICENSE_REVOCATION_PUBLIC_KEY: ${TIMEOFF_LICENSE_REVOCATION_PUBLIC_KEY:-}
      TIMEOFF_LICENSE_GRACE_DAYS: ${TIMEOFF_LICENSE_GRACE_DAYS:-14}
      # Branding - set in .env / host shell to rebrand. Empty (default) falls back to the LeavePilot defaults in lib/branding.js (D-01).
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_FAVICON_URL: ${BRAND_FAVICON_URL:-}
      BRAND_FAVICON_PNG_32_URL: ${BRAND_FAVICON_PNG_32_URL:-}
      BRAND_FAVICON_PNG_16_URL: ${BRAND_FAVICON_PNG_16_URL:-}
      BRAND_APP_ICON_URL: ${BRAND_APP_ICON_URL:-}
      BRAND_APPLE_TOUCH_ICON_URL: ${BRAND_APPLE_TOUCH_ICON_URL:-}
      BRAND_MANIFEST_URL: ${BRAND_MANIFEST_URL:-}
      BRAND_SENDER_EMAIL: ${BRAND_SENDER_EMAIL:-}
      APPLICATION_SENDER_EMAIL: ${APPLICATION_SENDER_EMAIL:-}
      BRAND_SENDER_NAME: ${BRAND_SENDER_NAME:-}
      BRAND_EMAIL_FROM: ${BRAND_EMAIL_FROM:-}
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN:-}
      PROMOTION_WEBSITE_DOMAIN: ${PROMOTION_WEBSITE_DOMAIN:-}
