# Demo stand for `npm run demo` (plan 06-03, INSTALL-03).
#
# A whole-file variation of docker-compose.community-image.yml (D-09): the
# demo shows exactly the delivery a customer receives - the published GHCR
# image, not a developer build. Differences from the template, all in the
# service of a disposable one-command stand:
#
#   - top-level `name: leavepilot-demo` isolates the project (containers and
#     volumes are prefixed, so the demo never collides with a real deploy or
#     the install-check stand of the same compose CLI);
#   - host port ${DEMO_PORT:-3001} (3001, so the demo coexists
#     with the install-check stand / a dev server on 3000);
#   - pull_policy is parameterized to ${LEAVEPILOT_DEMO_PULL_POLICY:-missing}
#     instead of the community template's hardcoded `always` (D-21): before
#     the first tag the stand boots a locally built image carrying the same
#     tag, and a mandatory pull of a GHCR tag that does not exist yet would
#     fail. Post-tag, an operator can `export LEAVEPILOT_DEMO_PULL_POLICY=always`;
#   - SESSION_SECRET/CRYPTO_SECRET carry demo-only `:-` defaults instead of
#     the template's `${VAR:?}` guards: `npm run demo` is a one-command
#     promise, so a fresh clone with no `.env` and no exported secrets must
#     interpolate cleanly (a `:?` guard fails interpolation for EVERY compose
#     command, including the wrapper's step-1 reset, before anything runs).
#     The `not-for-production` markers keep the values from being mistaken
#     for real secrets; the production compose files keep the hard guards.
#
# No demo-seed logic lives here or in the image (D-11): seeding is done from
# the host wrapper via `docker compose exec app node bin/seed_demo.js`.
name: leavepilot-demo

services:
  db:
    image: mysql:8.0.45
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-timeoff}
      MYSQL_USER: ${MYSQL_USER:-timeoff}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-timeoff_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${LEAVEPILOT_IMAGE:-ghcr.io/alexeylavrentev/leavepilot-community:latest}
    pull_policy: ${LEAVEPILOT_DEMO_PULL_POLICY:-missing}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-timeoff}
      DB_USER: ${MYSQL_USER:-timeoff}
      DB_PASSWORD: ${MYSQL_PASSWORD:-timeoff_password}
      DB_LOGGING: ${DB_LOGGING:-false}
      # Demo-only defaults (see the header): the stand is disposable, the
      # markers scream "not a real secret", and a fresh clone interpolates.
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-not-for-production}
      CRYPTO_SECRET: ${CRYPTO_SECRET:-demo-crypto-secret-not-for-production}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_MAX_AGE_MS: ${SESSION_COOKIE_MAX_AGE_MS:-43200000}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      # Branding - empty (default) falls back to the LeavePilot defaults in
      # lib/branding.js, so the demo renders the default brand (screenshot
      # prerequisite, D-13/D-14).
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_FAVICON_URL: ${BRAND_FAVICON_URL:-}
      BRAND_FAVICON_PNG_32_URL: ${BRAND_FAVICON_PNG_32_URL:-}
      BRAND_FAVICON_PNG_16_URL: ${BRAND_FAVICON_PNG_16_URL:-}
      BRAND_APP_ICON_URL: ${BRAND_APP_ICON_URL:-}
      BRAND_APPLE_TOUCH_ICON_URL: ${BRAND_APPLE_TOUCH_ICON_URL:-}
      BRAND_MANIFEST_URL: ${BRAND_MANIFEST_URL:-}
      BRAND_SENDER_EMAIL: ${BRAND_SENDER_EMAIL:-}
      APPLICATION_SENDER_EMAIL: ${APPLICATION_SENDER_EMAIL:-}
      BRAND_SENDER_NAME: ${BRAND_SENDER_NAME:-}
      BRAND_EMAIL_FROM: ${BRAND_EMAIL_FROM:-}
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN:-}
      PROMOTION_WEBSITE_DOMAIN: ${PROMOTION_WEBSITE_DOMAIN:-}
    ports:
      - "${DEMO_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (res) => { process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql_data:
  redis_data:
